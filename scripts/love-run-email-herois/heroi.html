<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;800&family=Bagel+Fat+One&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1100px;background:#0E0E0E;overflow:hidden;position:relative;font-family:Archivo,sans-serif}
.foto{position:absolute;inset:0 0 auto 0;height:860px;background-size:cover;background-position:50% 25%}
.foto:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,14,.55) 0%,rgba(14,14,14,0) 22%,rgba(14,14,14,0) 45%,#0E0E0E 100%)}
.topo{position:absolute;left:64px;top:56px;right:64px;display:flex;align-items:center;justify-content:space-between}
.marcas{display:flex;align-items:center;gap:18px;color:#cfc9c2;font-size:26px;font-weight:700}
.marcas img.s{height:38px}.marcas img.d{height:44px}
.cor{position:absolute;right:56px;top:470px;width:250px;transform:rotate(12deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.txt{position:absolute;left:64px;bottom:96px;right:64px}
.dex{height:92px;display:block;margin-bottom:6px}
h1{font-family:Anton;font-weight:400;text-transform:uppercase;line-height:.86;font-size:200px;color:#fff;letter-spacing:.005em}
h1 span{display:block;color:#E73A28}
.eq{display:inline-flex;gap:9px;align-items:flex-end;height:70px;margin-left:22px;vertical-align:baseline}
.eq i{width:16px;border-radius:5px;background:#F2C230;display:block}
.eq i:nth-child(2){background:#FF85A1}.eq i:nth-child(4){background:#fff}
.selos{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap}
.selo{font-weight:800;font-size:30px;padding:12px 26px;border-radius:999px;border:5px solid #fff;color:#0E0E0E;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.a{background:#F2C230;transform:rotate(-3deg)}.r{background:#FF85A1;transform:rotate(2deg)}
</style></head><body>
<div class="foto" id="foto"></div>
<div class="topo"><div class="marcas"><img class="s" src="../../public/dexcomplica-love-run/marca/somma-branca.svg">×<img class="d" src="../../public/dexcomplica-love-run/marca/dex-logo.png"></div></div>
<img class="cor" src="../../public/dexcomplica-love-run/marca/dex-coracao.png">
<div class="txt">
<h1 id="t"></h1>
<div class="selos" id="selos"></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('foto').style.backgroundImage=`url(../../public/dexcomplica-love-run/fotos/${q.get('foto')})`;
const [l1,l2]=q.get('t').split('|');
document.getElementById('t').innerHTML=`${l1}<span>${l2}<b class="eq"><i style="height:45%"></i><i style="height:90%"></i><i style="height:65%"></i><i style="height:100%"></i><i style="height:55%"></i></b></span>`;
document.getElementById('selos').innerHTML=q.get('s').split('|').map((s,i)=>`<span class="selo ${i?'r':'a'}">${s}</span>`).join('');
if(q.get('tam'))document.getElementById('t').style.fontSize=q.get('tam')+'px';
</script></body></html>
